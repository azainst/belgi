<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Земельный мониторинг — панель инспектора</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#17222d; --ink-2:#3d4b59; --muted:#6b7886; --line:#d9ddd6; --paper:#f4f5f1; --white:#fff;
  --accent:#1f5f7a;
  --ok:#22a06b; --signal:#f2b705; --violation:#e5484d; --progress:#f97316;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:20px;padding:10px 18px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:650;margin:0;letter-spacing:.1px}
header h1 small{display:block;font-weight:400;font-size:12px;color:#aab6c2}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.count{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;cursor:pointer;border:0;color:#fff}
.count:hover{background:rgba(255,255,255,.16)}
.count[aria-pressed=true]{background:#fff;color:var(--ink)}
.count b{font-size:15px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px 13px;cursor:pointer;font-size:14px}
.btn:hover{background:#eef0ec}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#184c62}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.28);color:#fff;font-size:13px;padding:6px 11px}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.ghost[aria-pressed=true]{background:#fff;color:var(--ink)}
#search{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;width:210px}
#search::placeholder{color:#aab6c2}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.warn b{color:var(--violation)}
.bars{display:grid;gap:8px;margin-top:6px}
.bar{font-size:13px}
.bar i{display:block;height:9px;border-radius:5px;background:var(--accent);margin-top:3px}
.risk{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.sigchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.chip{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:2px}
.chipsplit{border:0;background:none;cursor:pointer;font-size:13px;color:var(--muted);padding:3px 7px;border-radius:999px;line-height:1}
.chipsplit:hover{color:var(--violation);background:#fdecec}
.legend .sat{display:none}
body.sat .legend .sat{display:flex}

main{display:grid;grid-template-columns:1fr 390px;min-height:0}
#map{height:100%;min-height:300px;background:#dfe5e1}
aside{background:var(--paper);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.pad{padding:16px 18px 24px}
h2{font-size:15px;margin:0 0 4px;font-weight:650}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.4}

.queue{list-style:none;margin:0;padding:0}
.queue li{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.queue li:hover{background:#ebede8}
.queue .dot{margin-top:4px}
.queue .t{font-size:14px;font-weight:600}
.queue .s{font-size:13px;color:var(--muted);margin-top:2px}
.late{color:var(--violation);font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:18px 4px}

.back{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:14px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px 4px 9px;font-size:13px;font-weight:600;background:var(--white);border:1px solid var(--line)}
.cad{font-size:20px;font-weight:700;margin:8px 0 2px;letter-spacing:.2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec h3{font-size:14px;margin:0 0 8px;font-weight:650}
.seg{display:grid;gap:6px}
.seg button{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--white);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
label{display:block;font-size:13px;color:var(--ink-2);margin:10px 0 4px}
select,input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--white)}
textarea{resize:vertical;min-height:54px}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos a{display:block;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#dfe3dc;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:4px;bottom:4px;background:rgba(23,34,45,.82);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{padding:7px 0;border-top:1px solid var(--line);color:var(--ink-2);line-height:1.4}
.log time{display:block;color:var(--muted);font-size:12px}
.deadline{padding:9px 11px;border-radius:8px;background:#fff4e5;font-size:14px;margin-top:10px}
.deadline.late{background:#fdecec;color:#a4252a}

.reportpin{filter:drop-shadow(0 1px 3px rgba(0,0,0,.55))}
.clusterbubble{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  color:#fff;font-weight:700;font-size:13px;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 5px rgba(0,0,0,.4)}
.clusterpop{display:grid;gap:4px;min-width:200px}
.clusterpop-title{font-size:12px;color:var(--muted);margin-bottom:2px}
.clusterpop-item{display:flex;align-items:center;gap:8px;padding:6px 7px;border-radius:8px;cursor:pointer;font-size:13.5px}
.clusterpop-item:hover{background:#eef0ec}
.clusterpop-item .dot{width:10px;height:10px;border-radius:50%;flex:none}

.legend{position:absolute;left:12px;bottom:26px;z-index:500;background:rgba(255,255,255,.95);border-radius:10px;padding:9px 12px;font-size:12.5px;display:grid;gap:5px;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.legend div{display:flex;align-items:center;gap:8px}
.mapwrap{position:relative;min-height:0}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:600;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3);cursor:pointer;max-width:90%}
.toast[hidden]{display:none}
.pulse{animation:pulse 1.4s ease-out 3}
@keyframes pulse{0%{stroke-opacity:1;stroke-width:4}100%{stroke-opacity:0;stroke-width:22}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}
  aside{border-left:0;border-top:1px solid var(--line)}
  .counts{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Земельный мониторинг<small>Панель инспектора</small></h1>
    <div class="counts" id="counts" role="group" aria-label="Фильтр по статусу"></div>
    <div class="tools">
      <input id="search" type="search" placeholder="Поиск по кадастровому номеру" aria-label="Поиск по кадастровому номеру">
      <button class="btn ghost" id="btnSat" aria-pressed="false" title="Демо-модель: участки, похожие на неиспользуемые">Спутниковый анализ</button>
      <button class="btn ghost" id="btnStats">Аналитика</button>
      <button class="btn ghost" id="demoSignal" title="Создать тестовый сигнал жителя без Telegram">Тестовый сигнал</button>
      <button class="btn ghost" id="reset" title="Вернуть исходные данные">Сбросить демо</button>
    </div>
  </header>
  <main>
    <div class="mapwrap">
      <div id="map"></div>
      <div class="legend" aria-label="Легенда">
        <div><span class="dot" style="background:var(--ok)"></span>Нарушений нет</div>
        <div><span class="dot" style="background:var(--signal)"></span>Сигнал, первичная проверка</div>
        <div><span class="dot" style="background:var(--violation)"></span>Нарушение выявлено</div>
        <div><span class="dot" style="background:var(--progress)"></span>Идёт устранение</div>
        <div class="sat"><span class="dot" style="background:#7c3aed"></span>Подозрение (демо-модель)</div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <aside id="side"></aside>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STATUS = {
  ok:          {label:'Нарушений нет',                      color:'#22a06b', short:'Норма'},
  signal:      {label:'Сигнал / первичная проверка',        color:'#f2b705', short:'Сигналы'},
  violation:   {label:'Выявлено нарушение',                 color:'#e5484d', short:'Нарушения'},
  in_progress: {label:'В процессе устранения',              color:'#f97316', short:'Устранение'},
  resolved:    {label:'Устранено / возвращено государству', color:'#22a06b', short:'Устранено'},
};
const ORDER = ['signal','violation','in_progress','ok','resolved'];
const VTYPES = ['Неиспользование участка','Самозахват','Стихийная свалка','Нецелевое использование'];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let features = [], layerById = {}, geoLayer = null, selectedId = null, filter = null;
let pointLayers = [];  // маркеры и «пузыри»-кластеры точечных обращений (не входят в geoLayer)
const CLUSTER_PX = 28;  // точки ближе этого расстояния на экране показываем одним «пузырём» с числом
let signature = '', knownIds = null, cardStamp = '', satMode = false, view = 'queue';

const map = L.map('map', {zoomControl:true}).setView([42.9017, 71.3658], 12);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Esri World Imagery'});
L.control.layers({'Схема':osm, 'Спутник':sat}, null, {position:'topright'}).addTo(map);
map.on('zoomend moveend', () => draw());  // при смене масштаба пересчитываем кластеры — далёкие точки расходятся сами
map.on('popupopen', e => {
  const node = e.popup.getElement();
  if (!node) return;
  node.querySelectorAll('.clusterpop-item').forEach(el => {
    el.onclick = () => { map.closePopup(); select(+el.dataset.id, true); };
  });
});

function colorOf(p){ return STATUS[p.status].color; }
function isLate(p){ return p.deadline && ['violation','in_progress'].includes(p.status) && p.deadline < new Date().toISOString().slice(0,10); }
function daysLeft(d){ return Math.round((new Date(d+'T00:00:00') - new Date(new Date().toDateString())) / 86400000); }
function fmt(ts){ return ts ? ts.slice(0,16).replace('T',' ') : ''; }

function suspect(p){ return satMode && p.status === 'ok' && (p.risk || 0) >= 0.7; }
function styleOf(f, selected){
  const p = f.properties, c = suspect(p) ? '#7c3aed' : colorOf(p);
  const dim = filter && !matchFilter(p);
  return {color: selected ? '#17222d' : c, weight: selected ? 4 : suspect(p) ? 3 : 2, dashArray: suspect(p) ? '7 5' : null, fillColor:c, fillOpacity: dim ? .06 : suspect(p) ? .55 : .42, opacity: dim ? .25 : 1};
}
function matchFilter(p){ return !filter || (filter === 'ok' ? ['ok','resolved'].includes(p.status) : p.status === filter); }

// Точки-обращения рисуем НЕ так, как полигоны участков: сплошная заливка и белая обводка,
// чтобы обращение было видно, даже если оно физически стоит внутри настоящего участка того же цвета.
function pointStyle(f, selected){
  const p = f.properties, c = suspect(p) ? '#7c3aed' : colorOf(p);
  const dim = filter && !matchFilter(p);
  return {radius: selected ? 12 : 10, color: selected ? '#17222d' : '#ffffff', weight: selected ? 4 : 3,
          fillColor: c, fillOpacity: dim ? .25 : 1, opacity: dim ? .35 : 1, className: 'reportpin'};
}

function draw(){
  if (geoLayer) map.removeLayer(geoLayer);
  pointLayers.forEach(m => map.removeLayer(m));
  pointLayers = [];
  layerById = {};

  const polyFeatures = features.filter(f => f.geometry.type !== 'Point');
  const pointFeatures = features.filter(f => f.geometry.type === 'Point');

  geoLayer = L.geoJSON({type:'FeatureCollection', features: polyFeatures}, {
    style: f => styleOf(f, f.id === selectedId),
    onEachFeature: (f, layer) => {
      layerById[f.id] = layer;
      layer.on('click', () => select(f.id));
      layer.bindTooltip(esc(f.properties.cadastral) + (suspect(f.properties) ? ' · индекс подозрения ' + f.properties.risk.toFixed(2) : ''), {sticky:true});
    },
  }).addTo(map);
  if (selectedId && layerById[selectedId]) layerById[selectedId].bringToFront();

  // точечные обращения — группируем по расстоянию НА ЭКРАНЕ (в пикселях), а не по метрам:
  // так далёкие друг от друга при текущем масштабе точки сами расходятся при увеличении.
  const withXY = pointFeatures.map(f => ({
    f, xy: map.latLngToContainerPoint([f.geometry.coordinates[1], f.geometry.coordinates[0]]),
  }));
  const used = new Array(withXY.length).fill(false);
  const groups = [];
  for (let i = 0; i < withXY.length; i++) {
    if (used[i]) continue;
    const group = [withXY[i]]; used[i] = true;
    for (let j = i + 1; j < withXY.length; j++) {
      if (used[j]) continue;
      if (withXY[i].xy.distanceTo(withXY[j].xy) <= CLUSTER_PX) { group.push(withXY[j]); used[j] = true; }
    }
    groups.push(group);
  }

  const severityOrder = ['violation', 'in_progress', 'signal', 'resolved', 'ok'];
  groups.forEach(group => {
    if (group.length === 1) {
      const f = group[0].f;
      const layer = L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], pointStyle(f, f.id === selectedId));
      layer.on('click', () => select(f.id));
      layer.bindTooltip(esc(f.properties.cadastral) + ' · точка от жителя' + (suspect(f.properties) ? ' · индекс подозрения ' + f.properties.risk.toFixed(2) : ''), {sticky:true});
      layer.addTo(map);
      layerById[f.id] = layer;
      pointLayers.push(layer);
    } else {
      const center = [
        group.reduce((s, g) => s + g.f.geometry.coordinates[1], 0) / group.length,
        group.reduce((s, g) => s + g.f.geometry.coordinates[0], 0) / group.length,
      ];
      let color = STATUS.signal.color;
      for (const st of severityOrder) { if (group.some(g => g.f.properties.status === st)) { color = STATUS[st].color; break; } }
      const selectedInside = group.some(g => g.f.id === selectedId);
      const icon = L.divIcon({
        className: '', iconSize: [30, 30],
        html: `<div class="clusterbubble" style="background:${color};${selectedInside ? 'outline:3px solid #17222d;outline-offset:1px' : ''}">${group.length}</div>`,
      });
      const marker = L.marker(center, {icon}).addTo(map);
      const items = group.map((g, idx) => {
        const p = g.f.properties;
        return `<div class="clusterpop-item" data-id="${g.f.id}"><span class="dot" style="background:${STATUS[p.status].color}"></span>${idx + 1}. ${esc(p.cadastral)} — ${STATUS[p.status].label}${p.photos_count===0 ? ' (без фото)' : ''}</div>`;
      }).join('');
      marker.bindPopup(`<div class="clusterpop"><div class="clusterpop-title">${group.length} обращения в одной точке — выберите:</div>${items}</div>`);
      pointLayers.push(marker);
    }
  });
}

function counts(){
  const c = {signal:0, violation:0, in_progress:0, ok:0};
  features.forEach(f => { const s = f.properties.status; c[s === 'resolved' ? 'ok' : s]++; });
  const late = features.filter(f => isLate(f.properties)).length;
  $('#counts').innerHTML = Object.keys(c).map(k =>
    `<button class="count" data-f="${k}" aria-pressed="${filter===k}"><span class="dot" style="background:${STATUS[k].color}"></span><b>${c[k]}</b>${STATUS[k].short}</button>`
  ).join('') + (late ? `<span class="count" style="cursor:default;background:#e5484d"><b>${late}</b>просрочено</span>` : '');
  document.querySelectorAll('.count[data-f]').forEach(b => b.onclick = () => {
    filter = filter === b.dataset.f ? null : b.dataset.f; draw(); counts(); if (!selectedId) home();
  });
}

function home(){ if (view === 'stats') renderStats(); else if (satMode) renderSat(); else renderQueue(); }

function renderQueue(){
  selectedId = null; view = 'queue';
  const items = features.filter(f => matchFilter(f.properties) && (filter || !['ok','resolved'].includes(f.properties.status)))
    .sort((a,b) => ORDER.indexOf(a.properties.status) - ORDER.indexOf(b.properties.status) || b.properties.updated_at.localeCompare(a.properties.updated_at));
  $('#side').innerHTML = `<div class="pad"><h2>Очередь проверок</h2>
    <p class="hint">Новые сигналы от жителей, нарушения и сроки. Нажмите на строку или на участок на карте.</p>
    ${items.length ? `<ul class="queue">${items.map(f => { const p = f.properties; return `
      <li data-id="${f.id}" tabindex="0"><span class="dot" style="background:${colorOf(p)}"></span><div>
        <div class="t">${esc(p.cadastral)}${p.kind==='signal' ? ' · точка от жителя' : ''}${p.photos_count===0 ? ' · без фото' : ''}</div>
        <div class="s">${STATUS[p.status].label}${p.deadline && ['violation','in_progress'].includes(p.status) ? ` · срок ${p.deadline}` : ''}${isLate(p) ? ' <span class="late">просрочен</span>' : ''}</div>
      </div></li>`; }).join('')}</ul>` : '<div class="empty">Ничего не требует внимания.</div>'}
    <div class="row"><button class="btn" id="fit">Показать все участки</button></div></div>`;
  document.querySelectorAll('.queue li').forEach(li => { li.onclick = () => select(+li.dataset.id, true); li.onkeydown = e => { if (e.key === 'Enter') select(+li.dataset.id, true); }; });
  $('#fit').onclick = fitAll;
}

function renderSat(){
  selectedId = null; view = 'queue';
  const items = features.filter(f => suspect(f.properties)).sort((a,b) => b.properties.risk - a.properties.risk);
  $('#side').innerHTML = `<div class="pad"><h2>Спутниковый анализ</h2>
    <p class="hint">Демонстрация идеи: по снимкам (например, Sentinel-2) считается индекс подозрения на неиспользование. Здесь он рассчитан на тестовых данных, а не по реальным снимкам.</p>
    ${items.length ? `<ul class="queue">${items.map(f => `
      <li data-id="${f.id}" tabindex="0"><span class="dot" style="background:#7c3aed"></span><div>
        <div class="t">${esc(f.properties.cadastral)} <span class="risk">${f.properties.risk.toFixed(2)}</span></div>
        <div class="s">${esc(f.properties.purpose)}</div></div></li>`).join('')}</ul>` : '<div class="empty">Подозрительных участков нет.</div>'}
    <div class="row"><button class="btn primary" id="autoAll" ${items.length ? '' : 'disabled'}>Создать проверки автоматически</button></div></div>`;
  document.querySelectorAll('.queue li').forEach(li => { li.onclick = () => select(+li.dataset.id, true); li.onkeydown = e => { if (e.key === 'Enter') select(+li.dataset.id, true); }; });
  $('#autoAll').onclick = async () => {
    for (const f of items) await fetch(`/api/parcels/${f.id}/satellite-signal`, {method:'POST'});
    satMode = false; $('#btnSat').setAttribute('aria-pressed', 'false'); document.body.classList.remove('sat');
    await load(true); home();
  };
}

async function renderStats(){
  selectedId = null; view = 'stats'; draw();
  const st = await (await fetch('/api/stats')).json();
  const max = Math.max(1, ...Object.values(st.by_type));
  $('#side').innerHTML = `<div class="pad"><h2>Аналитика</h2>
    <p class="hint">Сводка по всем участкам и обращениям.</p>
    <div class="kpis">
      <div class="kpi"><b>${st.total}</b><span>участков на карте</span></div>
      <div class="kpi"><b>${st.signals_total}</b><span>обращений жителей (${st.signals_week} за неделю)</span></div>
      <div class="kpi"><b>${st.by_status.violation + st.by_status.in_progress}</b><span>активных нарушений (${st.area_ha_in_violation} га)</span></div>
      <div class="kpi ${st.overdue ? 'warn' : ''}"><b>${st.overdue}</b><span>просрочено по срокам</span></div>
      <div class="kpi"><b>${st.avg_days_to_resolve ?? '—'}</b><span>дней от выявления до устранения (в среднем)</span></div>
      <div class="kpi"><b>${st.suspects}</b><span>подозрительных участков (демо-модель)</span></div>
    </div>
    <div class="sec"><h3>Нарушения по видам</h3><div class="bars">
      ${Object.entries(st.by_type).map(([k,v]) => `<div class="bar">${esc(k)}: <b>${v}</b><i style="width:${Math.round(v/max*100)}%"></i></div>`).join('') || '<p class="hint">Пока нет данных.</p>'}
    </div></div>
    <div class="row"><button class="btn" id="statsBack">К очереди</button></div></div>`;
  $('#statsBack').onclick = () => { view = 'queue'; home(); };
}

function fitAll(){
  const b = L.latLngBounds([]);
  if (geoLayer && geoLayer.getBounds().isValid()) b.extend(geoLayer.getBounds());
  features.forEach(f => { if (f.geometry.type === 'Point') b.extend([f.geometry.coordinates[1], f.geometry.coordinates[0]]); });
  if (b.isValid()) map.fitBounds(b.pad(.15));
}

async function select(id, zoom){
  selectedId = id; draw();
  const layer = layerById[id];
  if (zoom) {
    if (layer) {
      layer.getBounds ? map.fitBounds(layer.getBounds().pad(1.5), {maxZoom:17}) : map.setView(layer.getLatLng(), 17);
    } else {
      // точка сейчас скрыта внутри «пузыря»-кластера — координаты берём прямо из данных и увеличиваем масштаб,
      // после чего она разойдётся с соседями и отрисуется как обычная отдельная точка
      const f = features.find(x => x.id === id);
      if (f && f.geometry.type === 'Point') map.setView([f.geometry.coordinates[1], f.geometry.coordinates[0]], 17);
    }
  }
  await renderCard(id);
  $('#side').scrollTop = 0;
}

async function renderCard(id){
  const p = await (await fetch('/api/parcels/' + id)).json();
  cardStamp = p.updated_at + p.photos.length;
  const st = STATUS[p.status];
  const late = isLate(p);
  const dl = p.deadline ? daysLeft(p.deadline) : null;
  const dlText = dl === null ? '' : dl < 0 ? `Просрочен на ${-dl} дн.` : dl === 0 ? 'Срок истекает сегодня' : `Осталось ${dl} дн.`;
  const showFields = ['violation','in_progress'].includes(p.status);
  $('#side').innerHTML = `<div class="pad">
    <button class="back" id="back">← К очереди</button><br>
    <span class="badge"><span class="dot" style="background:${st.color}"></span>${st.label}</span>
    <div class="cad">${esc(p.cadastral)}</div>
    <dl>
      <dt>Назначение</dt><dd>${esc(p.purpose)}</dd>
      <dt>Площадь</dt><dd>${p.area_ha != null ? p.area_ha + ' га' : 'уточняется'}</dd>
      ${p.violation_type ? `<dt>Нарушение</dt><dd>${esc(p.violation_type)}</dd>` : ''}
      <dt>Обращений</dt><dd>${p.signals_count}</dd>
    </dl>
    ${p.signal_codes.length ? `<div class="sigchips">${p.signal_codes.map(code => `
      <span class="chip">${code}${p.signal_codes.length > 1 ? `<button class="chipsplit" data-code="${code}" title="Отделить в отдельную точку — если это другое нарушение">✂ отделить</button>` : ''}</span>`).join('')}</div>` : ''}
    ${p.deadline && showFields ? `<div class="deadline ${late ? 'late' : ''}">Срок устранения: <b>${p.deadline}</b><br>${dlText}</div>` : ''}

    <div class="row"><a class="btn" style="text-align:center;text-decoration:none;color:var(--ink)" href="/api/parcels/${id}/act" target="_blank" rel="noopener">Акт осмотра (печать / PDF)</a></div>
    <div class="sec"><h3>Фотофиксация</h3>
      ${p.photos.length ? `<div class="photos">${p.photos.map(ph => `<a href="/uploads/${ph.filename}" target="_blank" rel="noopener"><img src="/uploads/${ph.filename}" alt="${esc(ph.caption)}" loading="lazy"><span>${ph.signal_code ? ph.signal_code : (ph.source==='citizen'?'житель':'инспектор')}</span></a>`).join('')}</div>` : '<p class="hint">Фото пока нет.</p>'}
      <div class="row"><label class="btn" style="text-align:center;margin:0;color:var(--ink)">Добавить фото<input id="file" type="file" accept="image/*" hidden></label></div>
    </div>

    <div class="sec"><h3>Статус участка</h3>
      <div class="seg" id="seg">${['signal','violation','in_progress','resolved','ok'].map(k => `
        <button data-s="${k}" aria-pressed="${p.status===k}"><span class="dot" style="background:${STATUS[k].color}"></span>${k==='ok' ? 'Нарушения нет (закрыть сигнал)' : STATUS[k].label}</button>`).join('')}
      </div>
      <div id="fields" ${showFields ? '' : 'hidden'}>
        <label for="vt">Вид нарушения</label>
        <select id="vt">${VTYPES.map(v => `<option ${p.violation_type===v?'selected':''}>${v}</option>`).join('')}</select>
        <label for="dl">Контрольный срок устранения</label>
        <input type="date" id="dl" value="${p.deadline || ''}">
      </div>
      <label for="note">Комментарий</label>
      <textarea id="note" placeholder="Например: составлен акт осмотра"></textarea>
      <div class="row"><button class="btn primary" id="save">Сохранить статус</button></div>
    </div>

    <div class="sec"><h3>История</h3>
      <ul class="log">${p.events.map(e => `<li>${esc(e.text)}<time>${fmt(e.created_at)}</time></li>`).join('')}</ul>
    </div></div>`;

  let chosen = p.status;
  $('#back').onclick = () => { selectedId = null; draw(); home(); };
  document.querySelectorAll('.chipsplit').forEach(btn => btn.onclick = async () => {
    const code = btn.dataset.code;
    if (!confirm(`Отделить обращение ${code} в отдельную точку на карте? Используйте, если рядом на самом деле два разных нарушения.`)) return;
    const sid = parseInt(code.slice(3), 10);
    const r = await fetch(`/api/signals/${sid}/split`, {method:'POST'});
    if (!r.ok) { alert((await r.json()).detail || 'Не удалось отделить обращение'); return; }
    const newParcel = await r.json();
    await load(true);
    select(newParcel.id, true);
  });
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
    chosen = b.dataset.s;
    document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('#fields').hidden = !['violation','in_progress'].includes(chosen);
    if (chosen === 'violation' && !$('#dl').value) { const d = new Date(); d.setDate(d.getDate() + 30); $('#dl').value = d.toISOString().slice(0,10); }
  });
  $('#save').onclick = async () => {
    const body = {status: chosen, note: $('#note').value.trim() || null};
    if (['violation','in_progress'].includes(chosen)) { body.deadline = $('#dl').value || null; body.violation_type = $('#vt').value; }
    $('#save').disabled = true;
    await fetch(`/api/parcels/${id}/status`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    await load(true);
    await renderCard(id);
  };
  $('#file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const fd = new FormData(); fd.append('file', f);
    const r = await fetch(`/api/parcels/${id}/photos`, {method:'POST', body:fd});
    if (!r.ok) { alert((await r.json()).detail || 'Не удалось загрузить фото'); return; }
    await load(true); await renderCard(id);
  };
}

function toast(msg, id){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  t.onclick = () => { t.hidden = true; if (id) select(id, true); };
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 9000);
}

async function load(force){
  const data = await (await fetch('/api/parcels')).json();
  const sig = data.features.map(f => [f.id, f.properties.status, f.properties.updated_at, f.properties.photos_count].join(':')).join('|');
  if (!force && sig === signature) return;
  const first = knownIds === null;
  features = data.features; signature = sig;
  if (!first) {
    const fresh = features.filter(f => !knownIds.has(f.id) && f.properties.status === 'signal');
    if (fresh.length) { toast('Новый сигнал от жителя — нажмите, чтобы открыть', fresh[0].id); }
  }
  const prevSignals = window._sigStatus || {};
  features.forEach(f => {
    if (!first && f.properties.status === 'signal' && prevSignals[f.id] && prevSignals[f.id] !== 'signal') toast('Поступил новый сигнал по участку ' + f.properties.cadastral, f.id);
  });
  window._sigStatus = Object.fromEntries(features.map(f => [f.id, f.properties.status]));
  knownIds = new Set(features.map(f => f.id));
  draw(); counts();
  if (first) fitAll();
  if (selectedId) {
    const cur = features.find(f => f.id === selectedId);
    if (cur && !force && cardStamp !== cur.properties.updated_at + cur.properties.photos_count && !document.activeElement.closest('#side')) renderCard(selectedId);
  } else if (view === 'queue') home();
}

$('#demoSignal').onclick = async () => { const r = await fetch('/api/demo/signal', {method:'POST'}); if (!r.ok) alert('Нет свободных участков для теста'); await load(true); };
$('#reset').onclick = async () => { if (!confirm('Вернуть исходные тестовые данные? Все изменения пропадут.')) return; await fetch('/api/demo/reset', {method:'POST'}); knownIds = null; selectedId = null; filter = null; satMode = false; view = 'queue'; $('#btnSat').setAttribute('aria-pressed','false'); document.body.classList.remove('sat'); await load(true); fitAll(); };

$('#btnSat').onclick = () => {
  satMode = !satMode; view = 'queue';
  $('#btnSat').setAttribute('aria-pressed', satMode); document.body.classList.toggle('sat', satMode);
  draw(); if (!selectedId) home();
};
$('#btnStats').onclick = () => renderStats();
$('#search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const f = features.find(x => String(x.properties.cadastral).toLowerCase().includes(q));
  if (f) select(f.id, true); else toast('Участок не найден: ' + e.target.value, selectedId || 0);
});

// живое обновление (SSE) + опрос раз в 4 с: через туннели вроде Cloudflare SSE может не работать
load(true).then(() => {
  try { new EventSource('/api/stream').onmessage = () => load(false).catch(()=>{}); } catch (e) {}
  setInterval(() => load(false).catch(()=>{}), 4000);
});
</script>
